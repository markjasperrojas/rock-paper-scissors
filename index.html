<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>ROCK-PAPER-SCISSORS</h1>
    <p>
      Rock, Paper, Scissors is a simple game of quick choices and instant
      results. First to score 5 wins.
    </p>
    <p>Choose your weapon:</p>

    <div class="buttons">
      <button id="rock">Rock</button><button id="paper">Paper</button
      ><button id="scissors">Scissors</button>
    </div>

    <br />

    <div id="result">Result:</div>
    <div id="player-score">Player score: 0</div>
    <div id="computer-score">Computer score: 0</div>
  </body>
</html>
